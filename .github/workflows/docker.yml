name: Publish Docker image

on: [push, pull_request]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify runtime packaging and library
        run: bundle exec rake

      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify packaged runtime tools
        id: tools
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          printf 'image=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          docker run --rm "$image_tag" sh -ec '
            helm version --short | grep -E "^v4\.3\.0\+zapravila\.20261006\.gbec5b06$"
            helmfile --version | grep -E "^helmfile version v1\.8\.1\+zapravila\.20261006$"
            helmsnap --version
            ruby -r helmsnap -e "puts Helmsnap::VERSION"
            test ! -e /wd/.git
            test ! -d /wd/vendor
          '

      - name: Check runtime security updates
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ steps.tools.outputs.image }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'

      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          kubectl_version: v1.34.3
          cluster_name: helmsnap-default
          wait: 120s

      - name: Verify live Kubernetes 1.34 operations
        env:
          RUNTIME_IMAGE: ${{ steps.tools.outputs.image }}
        run: |
          tools_dir="$(mktemp -d)"
          container="$(docker create "$RUNTIME_IMAGE" true)"
          trap 'docker rm "$container" >/dev/null; rm -rf "$tools_dir"' EXIT
          docker cp "$container:/usr/bin/helm" "$tools_dir/helm"
          docker cp "$container:/usr/local/bin/helmfile" "$tools_dir/helmfile"
          chmod +x "$tools_dir/helm" "$tools_dir/helmfile"
          PATH="$tools_dir:$PATH" HELMSNAP_DISPOSABLE_CLUSTER=yes \
            bash scripts/check-bridge-cluster.sh "$HOME/.kube/config" default-security

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
